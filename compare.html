<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>横向比较 —— 跨公司同指标对比</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="js/echarts.min.js"></script>
<script src="data/companies_data.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #f5f6fa; font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 40px; }
  .back { display:inline-block; font-size:13px; color:#2f80ed; text-decoration:none; margin-bottom:12px; }
  .back:hover { text-decoration:underline; }
  h1 { font-size: 20px; color: #1f2d3d; margin: 0 0 4px; }
  .sub { color: #6b7a8d; font-size: 13px; margin-bottom: 14px; }
  .toolbar { background:#fff; border-radius:8px; padding:14px 16px; box-shadow:0 1px 4px rgba(0,0,0,.06); margin-bottom:14px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px; }
  .row:last-child { margin-bottom:0; }
  .label { font-size:13px; color:#4a5568; white-space:nowrap; }
  .btn {
    border:1px solid #c8ced8; background:#fff; color:#4a5568; padding:5px 12px;
    font-size:13px; cursor:pointer; border-radius:4px; transition: all .12s;
  }
  .btn:hover { border-color:#2f80ed; color:#2f80ed; }
  .btn.active { background:#2f80ed; border-color:#2f80ed; color:#fff; }
  .company-panel { background:#fff; border-radius:8px; padding:14px 16px; box-shadow:0 1px 4px rgba(0,0,0,.06); margin-bottom:14px; }
  .type-title { font-size:13px; font-weight:600; color:#1f2d3d; margin:8px 0 6px; }
  .type-title .cnt { font-weight:normal; color:#8a94a6; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip {
    display:inline-flex; align-items:center; gap:5px; background:#f0f2f5; border:1px solid transparent;
    border-radius:4px; padding:4px 9px; font-size:12px; color:#4a5568; cursor:pointer; user-select:none;
  }
  .chip:hover { border-color:#c8ced8; }
  .chip.on { background:#e8f0fe; border-color:#2f80ed; color:#2f80ed; }
  .chip .ck { accent-color:#2f80ed; }
  .chip.cap { border-left:2px solid #27ae60; }
  #chart { width:100%; height:620px; background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .note { margin-top:14px; color:#8a94a6; font-size:12px; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 返回主页</a>
  <h1>横向比较 —— 跨公司同指标对比</h1>
  <div class="sub">勾选公司、选择指标，在同一图中对比。默认指标为「市值(分红前)」，默认「统一基准」指数（全局最大=100，保留绝对水平高低关系）。</div>

  <div class="toolbar">
    <div class="row">
      <span class="label">指标：</span>
      <button class="btn metric active" data-m="mcRestored">市值(分红前)</button>
      <button class="btn metric" data-m="marketCap">总市值</button>
      <button class="btn metric" data-m="pe">市盈率 PE</button>
      <button class="btn metric" data-m="pb">市净率 PB</button>
      <button class="btn metric" data-m="dividendPerShare">每股股利</button>
      <button class="btn metric" data-m="capacity">装机容量(万千瓦)</button>
      <button class="btn metric" data-m="mcPerOpGW">市值/在运万千瓦</button>
      <button class="btn metric" data-m="mcPerTotalGW">市值/总规模万千瓦</button>
    </div>
    <div class="row">
      <span class="label">显示：</span>
      <button class="btn mode active" data-mode="relative">统一基准（全局最大=100）</button>
      <button class="btn mode" data-mode="index">各自基期（自身首期=100）</button>
      <button class="btn mode" data-mode="abs">绝对值</button>
      <span style="flex:1"></span>
      <button class="btn" id="selectAll">全选</button>
      <button class="btn" id="clearAll">清空</button>
    </div>
  </div>

  <div class="company-panel" id="companyPanel"></div>

  <div id="chart"></div>
  <div class="note" id="noteBox"></div>
</div>

<script>
const chart = echarts.init(document.getElementById('chart'));
let DATA = null;          // 全部公司数据
let selected = new Set(); // 选中公司代码
let curMetric = 'mcRestored';
let curMode = 'relative';    // relative | index | abs

const METRICS = {
  mcRestored:      { label: '市值(分红前)', unit: '亿元' },
  marketCap:       { label: '总市值',      unit: '亿元' },
  pe:              { label: '市盈率PE',    unit: '倍' },
  pb:              { label: '市净率PB',    unit: '倍' },
  dividendPerShare:{ label: '每股股利',    unit: '元' },
  capacity:        { label: '装机容量',    unit: '万千瓦' },
  mcPerOpGW:       { label: '市值/在运万千瓦', unit: '亿元/万千瓦' },
  mcPerTotalGW:    { label: '市值/总规模万千瓦', unit: '亿元/万千瓦' },
};
const TYPE_ORDER = ['核电', '水电', '火电', '风光电', '其他'];

// 30+ 色调色板
const PALETTE = [
  '#e74c3c','#2f80ed','#27ae60','#9b59b6','#e67e22','#f39c12','#1abc9c','#3498db',
  '#e84393','#16a085','#d35400','#8e44ad','#2c3e50','#c0392b','#00acc1','#f1c40f',
  '#5d6d7e','#a93226','#7d3c98','#117a65','#b7950b','#1a5276','#922b21','#0e6655',
  '#6c3483','#a04000','#148f77','#2471a3','#b03a2e','#1e8449',
];

function fmt(v) {
  return Number.isFinite(v) ? v.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) : String(v);
}

// 取某指标序列首个非 null 值作为基期
function baseValue(arr) {
  for (const p of arr) { if (p[1] !== null && p[1] !== undefined) return p[1]; }
  return 1;
}

// 前向填充取某日期对应的规模值
function ffillAt(date, arr) {
  let last = null;
  for (const [d, v] of arr) { if (d <= date) last = v; else break; }
  return last;
}

// 计算 mc/规模 比值序列（规模前向填充）
function computeRatio(mcArr, scaleArr) {
  if (!mcArr || !scaleArr || !scaleArr.length) return null;
  const out = [];
  let gi = 0, lastScale = null;
  for (const [d, mc] of mcArr) {
    while (gi < scaleArr.length && scaleArr[gi][0] <= d) { lastScale = scaleArr[gi][1]; gi++; }
    if (lastScale && mc !== null && mc !== undefined) out.push([d, +(mc / lastScale).toFixed(3)]);
    else out.push([d, null]);
  }
  return out;
}

// 核电总规模（在运+在建）万千瓦序列
function computeTotalGW(c) {
  const a = (c.reactor || []).map(([d, n]) => [d, n * c.gwPerOp]);
  const b = (c.underConstruction || []).map(([d, n]) => [d, n * c.gwPerUc]);
  const am = new Map(a), bm = new Map(b);
  const dates = [...new Set([...am.keys(), ...bm.keys()])].sort();
  const out = [];
  let la = null, lb = null;
  for (const d of dates) {
    if (am.has(d)) la = am.get(d);
    if (bm.has(d)) lb = bm.get(d);
    if (la !== null && lb !== null) out.push([d, +(la + lb).toFixed(1)]);
  }
  return out;
}

// 计算派生估值密度指标（市值/在运万千瓦、市值/总规模万千瓦）
function computeDensityMetrics(c) {
  const mc = c.mcRestored || c.marketCap || [];
  // 市值/在运万千瓦
  if (c.gwPerOp && c.reactor && c.reactor.length) {
    const reactorGW = c.reactor.map(([d, n]) => [d, n * c.gwPerOp]);
    c.mcPerOpGW = computeRatio(mc, reactorGW);
  } else if (c.capacity && c.capacity.length) {
    c.mcPerOpGW = computeRatio(mc, c.capacity);
  }
  // 市值/总规模万千瓦
  if (c.gwPerOp && c.gwPerUc && c.reactor && c.underConstruction) {
    c.mcPerTotalGW = computeRatio(mc, computeTotalGW(c));
  } else if (c.capacity && c.capacity.length) {
    // 无在建数据，以装机容量近似（说明里标注）
    c.mcPerTotalGW = computeRatio(mc, c.capacity);
  }
}

function render() {
  // 过滤：仅保留已勾选 且 该指标有数据 的公司
  const companies = DATA.companies.filter(
    c => selected.has(c.code) && Array.isArray(c[curMetric]) && c[curMetric].length > 0
  );
  // 统一基准：所有选中公司该指标的「全局最大值」作为 100，保留绝对水平的高低关系
  let relBase = 1;
  if (curMode === 'relative') {
    const allVals = [];
    for (const c of companies) {
      for (const p of (c[curMetric] || [])) {
        if (p[1] !== null && p[1] !== undefined) allVals.push(p[1]);
      }
    }
    relBase = allVals.length ? Math.max(...allVals) : 1;
  }

  const series = companies.map((c, i) => {
    const raw = c[curMetric] || [];
    const color = PALETTE[i % PALETTE.length];
    let data;
    if (curMode === 'relative') {
      // 统一基准：值 / 全局最大值 × 100
      data = raw.map(p => ({
        value: [p[0], p[1] === null || p[1] === undefined ? null : +(p[1] / relBase * 100).toFixed(2)],
        raw: p[1],
      }));
    } else if (curMode === 'index') {
      const base = baseValue(raw);
      data = raw.map(p => ({
        value: [p[0], p[1] === null || p[1] === undefined ? null : +(p[1] / base * 100).toFixed(2)],
        raw: p[1],
      }));
    } else {
      data = raw.map(p => ({
        value: [p[0], p[1] === null || p[1] === undefined ? null : p[1]],
        raw: p[1],
      }));
    }
    return {
      name: c.name, type: 'line', data,
      showSymbol: false, smooth: true,
      lineStyle: { width: 2, color }, itemStyle: { color },
    };
  });

  const m = METRICS[curMetric];
  const yName = curMode === 'relative' ? '统一基准指数 (全局最大=100)'
              : curMode === 'index' ? '指数 (各自基期=100)'
              : `${m.label} (${m.unit})`;
  chart.setOption({
    color: PALETTE,
    legend: { type: 'scroll', top: 2, left: 'center', textStyle: { color: '#4a5568', fontSize: 12 } },
    tooltip: {
      trigger: 'axis',
      backgroundColor: 'rgba(30,40,55,.92)', borderWidth: 0, textStyle: { color: '#fff', fontSize: 12 },
      formatter: function (params) {
        let s = '<b>' + params[0].axisValueLabel + '</b>';
        params.forEach(it => {
          if (it.value[1] === null || it.value[1] === undefined) return;
          const raw = it.data && it.data.raw;
          if (curMode === 'relative' || curMode === 'index') {
            // 指数模式：同时展示指数 + 数据原值
            s += '<br/>' + it.marker + it.seriesName + '：指数 ' + fmt(it.value[1]) +
                 (raw !== null && raw !== undefined ? '　<span style="opacity:.8">原值 ' + fmt(raw) + ' ' + m.unit + '</span>' : '');
          } else {
            s += '<br/>' + it.marker + it.seriesName + '：' + fmt(it.value[1]) + ' ' + m.unit;
          }
        });
        return s;
      }
    },
    grid: { left: 70, right: 40, top: 60, bottom: 70 },
    xAxis: {
      type: 'time', axisLine: { lineStyle: { color: '#c8ced8' } },
      axisLabel: { color: '#6b7a8d', fontSize: 11 }, splitLine: { show: false },
    },
    yAxis: {
      type: 'value', name: yName, scale: true,
      nameTextStyle: { color: '#6b7a8d', fontSize: 11 },
      axisLabel: { color: '#6b7a8d', fontSize: 11 }, splitLine: { lineStyle: { color: '#eef0f5' } },
    },
    dataZoom: [
      { type: 'inside', start: 0, end: 100 },
      { type: 'slider', bottom: 8, height: 20, borderColor: '#d5dbe5' },
    ],
    series,
  }, true);  // notMerge=true：完全替换，避免切换指标/公司时旧系列残留

  // 说明
  const n = series.length;
  document.getElementById('noteBox').innerHTML =
    `当前指标：<b>${m.label}</b>（${m.unit}），共 <b>${n}</b> 家公司。` +
    (curMode === 'relative'
      ? `统一基准指数：以所有选中公司该指标<b>全局最大值 = 100</b>，各公司按比例折算，保留绝对水平的高低关系（数值大的公司在图上方）。`
      : curMode === 'index'
      ? `各自基期指数：每家以自身该指标<b>首个披露值 = 100</b>，只比较走势/涨跌，不反映绝对规模。`
      : `绝对值：直接比较各公司该指标的量级（亿元/倍/元/万千瓦）。`) +
    (curMetric === 'capacity'
      ? ` 装机容量仅 11 家龙头有数据（基于公开披露信息的整理/估算值），其余公司无此指标。` : '') +
    (curMetric === 'mcPerOpGW'
      ? ` 口径：市值(分红前) ÷ 在运装机万千瓦（核电按机组数×平均单机容量，发电企业按装机容量近似；川投能源为权益装机口径）。` : '') +
    (curMetric === 'mcPerTotalGW'
      ? ` 口径：市值(分红前) ÷ 总规模万千瓦（核电=在运+在建；发电企业无在建数据、以装机容量近似；川投能源为权益装机口径）。` : '');
}

function buildCompanyPanel() {
  const panel = document.getElementById('companyPanel');
  panel.innerHTML = '';
  const byType = {};
  for (const c of DATA.companies) {
    (byType[c.type] = byType[c.type] || []).push(c);
  }
  for (const t of TYPE_ORDER) {
    const list = byType[t];
    if (!list || !list.length) continue;
    const title = document.createElement('div');
    title.className = 'type-title';
    title.innerHTML = `${t} <span class="cnt">(${list.length} 家)</span>`;
    panel.appendChild(title);
    const chips = document.createElement('div');
    chips.className = 'chips';
    for (const c of list) {
      const label = document.createElement('label');
      label.className = 'chip' + (c.capacity ? ' cap' : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.className = 'ck'; cb.checked = selected.has(c.code);
      cb.onchange = () => {
        if (cb.checked) selected.add(c.code); else selected.delete(c.code);
        label.classList.toggle('on', cb.checked);
        render();
      };
      const nm = document.createElement('span');
      nm.textContent = c.name + (c.capacity ? ' ★' : '');
      label.appendChild(cb); label.appendChild(nm);
      label.onclick = (e) => { if (e.target !== cb) cb.click(); };
      if (cb.checked) label.classList.add('on');
      chips.appendChild(label);
    }
    panel.appendChild(chips);
  }
}

// 加载数据（通过 <script src="data/companies_data.js"> 注入 window.ALL_COMPANIES_DATA）
const d = window.ALL_COMPANIES_DATA;
if (!d || !d.companies) {
  document.getElementById('noteBox').textContent = '数据加载失败：未找到 window.ALL_COMPANIES_DATA';
} else {
  DATA = d;
  // 为每家公司计算派生估值密度指标（市值/在运万千瓦、市值/总规模万千瓦）
  for (const c of d.companies) {
    computeDensityMetrics(c);
  }
  // 默认选中：核电 2 家 + 有装机容量的 11 家
  for (const c of d.companies) {
    if (c.type === '核电' || c.capacity) selected.add(c.code);
  }
  buildCompanyPanel();
  render();
}

// 指标切换
document.querySelectorAll('.metric').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.metric').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curMetric = btn.dataset.m;
    // 装机容量默认切绝对值（指数化无意义）
    if (curMetric === 'capacity' && curMode !== 'abs') {
      curMode = 'abs';
      document.querySelectorAll('.mode').forEach(b => b.classList.toggle('active', b.dataset.mode === 'abs'));
    }
    render();
  };
});

// 模式切换
document.querySelectorAll('.mode').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curMode = btn.dataset.mode;
    render();
  };
});

document.getElementById('selectAll').onclick = () => {
  DATA.companies.forEach(c => selected.add(c.code));
  buildCompanyPanel(); render();
};
document.getElementById('clearAll').onclick = () => {
  selected.clear(); buildCompanyPanel(); render();
};

window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
